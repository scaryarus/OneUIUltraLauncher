
name: Build One UI Ultra APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q OneUIUltraLauncher-project.zip -d extracted

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix JVM targets
        run: |
          cd extracted/OneUIUltraLauncher
          cat >> app/build.gradle.kts <<'EOF'

          tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          EOF

      - name: Build APK
        run: |
          cd extracted/OneUIUltraLauncher
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneUIUltraLauncher-APK
          path: extracted/OneUIUltraLauncher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
