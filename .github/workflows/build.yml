
name: Build One UI Ultra APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name "OneUIUltraLauncher-project.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            mkdir -p extracted
            unzip -q "$ZIP" -d extracted
          fi

      - name: Find Gradle
        run: |
          WRAPPER=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found!"
            exit 1
          fi
          echo "GRADLE_DIR=$(dirname "$WRAPPER")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneUIUltraLauncher-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
